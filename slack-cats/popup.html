<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Slack Cats</title>
<style>
*{box-sizing:border-box}
body{width:320px;margin:0;padding:16px;background:#555;color:#fff;font-family:"Trebuchet MS",system-ui,sans-serif;transition:background .3s,color .3s}
body[data-phase="break"]{background:#fff;color:#111}
.top{display:flex;align-items:center;gap:12px}
#cat{width:70px;height:92px;overflow:hidden;flex:none}
#cat svg{width:100%;display:block}
#time{font-size:52px;font-weight:700;line-height:1}
#status{margin:2px 0 0;opacity:.85}
button{font:inherit;font-weight:700;background:#fff;color:#111;border:3px solid #111;border-radius:999px;padding:9px 18px;cursor:pointer;width:100%;margin:14px 0 10px}
body[data-phase="focus"] button{background:#ffd400}
details{border-top:2px solid currentColor;padding-top:8px}
summary{cursor:pointer;font-weight:700}
label{display:block;margin:8px 0 3px;font-size:13px}
input,select,textarea{width:100%;font:inherit;padding:6px 8px;border:2px solid #111;border-radius:10px;background:#fff;color:#111}
textarea{height:110px;resize:vertical}
.row{display:flex;gap:8px}.row>div{flex:1}
small{display:block;margin-top:6px;opacity:.75}
</style></head>
<body data-phase="idle">
<div class="top"><div id="cat"></div><div><div id="time">25:00</div><p id="status">Ready when you are</p></div></div>
<button id="go">Start focus</button>
<details>
  <summary>Settings</summary>
  <div class="row">
    <div><label for="focus">Focus (min)</label><input id="focus" type="number" min="1" max="180"></div>
    <div><label for="brk">Break (min)</label><input id="brk" type="number" min="1" max="60"></div>
  </div>
  <label for="mode">Cats attack when…</label>
  <select id="mode">
    <option value="block">I visit a site on the block list</option>
    <option value="allow">I visit any site NOT on the study list</option>
  </select>
  <label for="sites">Sites (one per line)</label>
  <textarea id="sites" spellcheck="false"></textarea>
  <small>Changes save automatically. Reload open tabs once after installing.</small>
</details>
<script src="shared.js"></script>
<script src="popup.js"></script>
</body></html>
